name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: autoscaler/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: autoscaler
          args: --fast
        env:
          GOMEMLIMIT: 2GiB

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: autoscaler/go.sum

      - name: Run tests
        working-directory: autoscaler
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage report
        working-directory: autoscaler
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: autoscaler/coverage.out

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: autoscaler/
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}:main,{1}:{2}', env.IMAGE_NAME, env.IMAGE_NAME, steps.vars.outputs.short_sha) || format('{0}:ci-{1}', env.IMAGE_NAME, steps.vars.outputs.short_sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  grype:
    name: Vulnerability Scan
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: anchore/scan-action@v7
        id: grype
        with:
          image: ${{ env.IMAGE_NAME }}:ci-${{ needs.build.outputs.short_sha }}
          severity-cutoff: critical
          fail-build: false
          output-format: sarif

      - name: Upload SARIF (only if grype found results)
        if: always() && steps.grype.outputs.exit-code == '1'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
