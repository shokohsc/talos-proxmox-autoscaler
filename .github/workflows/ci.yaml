name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22.x"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: autoscaler/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: autoscaler

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: autoscaler/go.sum

      - name: Run tests
        working-directory: autoscaler
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: autoscaler/coverage.out

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: autoscaler/
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  grype:
    name: Vulnerability Scan
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/scan-action@v4
        id: grype
        with:
          image: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          severity-cutoff: critical
          fail-build: false
          output-format: sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype.outputs.sarif != '' && hashFiles(steps.grype.outputs.sarif) != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
