apiVersion: autoscaler.talos.dev/v1alpha1
kind: MachineClass
metadata:
  name: standard
spec:
  vcpu: 4
  memoryGiB: 8
  diskGiB: 100
  networkBridge: vmbr0
  storagePool: local-lvm
---
apiVersion: autoscaler.talos.dev/v1alpha1
kind: MachineDeployment
metadata:
  name: workers
  namespace: default
spec:
  replicas: 3
  machineClassName: standard
  minReplicas: 1
  maxReplicas: 20
  template:
    metadata:
      labels:
        role: worker
        class: standard
    spec:
      bootTimeout: "5m"
