apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: talos-proxmox-autoscaler
  namespace: autoscaler-system
  labels:
    app.kubernetes.io/name: talos-proxmox-autoscaler
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    name: talos-proxmox-autoscaler
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: external
      metadata:
        scalerAddress: talos-proxmox-autoscaler.autoscaler-system:8080
        safeHpaMinimum: "0"
