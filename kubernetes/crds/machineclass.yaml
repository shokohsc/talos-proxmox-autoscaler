apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclasses.autoscaler.talos.dev
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: autoscaler.talos.dev
  names:
    kind: MachineClass
    listKind: MachineClassList
    plural: machineclasses
    singular: machineclass
    shortNames:
      - mc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vcpu
                - memoryGiB
                - diskGiB
              properties:
                vcpu:
                  type: integer
                  minimum: 1
                  description: Number of virtual CPUs
                memoryGiB:
                  type: integer
                  minimum: 1
                  description: Memory in GiB
                diskGiB:
                  type: integer
                  minimum: 1
                  description: Disk size in GiB
                networkBridge:
                  type: string
                  description: Proxmox network bridge
                storagePool:
                  type: string
                  description: Proxmox storage pool
                macAddress:
                  type: string
                  description: MAC address for the primary NIC (optional)
                serial:
                  type: string
                  description: SMBIOS serial number (optional)
            status:
              type: object
              properties:
                ready:
                  type: boolean
                availableReplicas:
                  type: integer
      additionalPrinterColumns:
        - name: vCPU
          type: integer
          jsonPath: .spec.vcpu
        - name: Memory
          type: integer
          jsonPath: .spec.memoryGiB
        - name: Disk
          type: integer
          jsonPath: .spec.diskGiB
        - name: MAC
          type: string
          jsonPath: .spec.macAddress
        - name: Serial
          type: string
          jsonPath: .spec.serial
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
