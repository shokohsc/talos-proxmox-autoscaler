apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-proxmox-autoscaler
  namespace: autoscaler-system
  labels:
    app.kubernetes.io/name: talos-proxmox-autoscaler
    app.kubernetes.io/component: autoscaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-proxmox-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-proxmox-autoscaler
        app.kubernetes.io/component: autoscaler
    spec:
      serviceAccountName: talos-proxmox-autoscaler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autoscaler
          image: ghcr.io/your-org/talos-proxmox-autoscaler:latest
          imagePullPolicy: Always
          env:
            - name: PROXMOX_API_URL
              valueFrom:
                configMapKeyRef:
                  name: autoscaler-config
                  key: proxmox_api_url
            - name: PROXMOX_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: autoscaler-config
                  key: proxmox_insecure
                  optional: true
            - name: BASE_VMID
              valueFrom:
                configMapKeyRef:
                  name: autoscaler-config
                  key: base_vmid
                  optional: true
            - name: PROXMOX_API_TOKEN_ID_FILE
              value: "/etc/secrets/proxmox_api_token_id"
            - name: PROXMOX_API_TOKEN_SECRET_FILE
              value: "/etc/secrets/proxmox_api_token_secret"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: secrets
          secret:
            secretName: autoscaler-secrets
      nodeSelector:
        kubernetes.io/os: linux
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: talos-proxmox-autoscaler
